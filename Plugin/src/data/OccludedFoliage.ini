[General]
; Toggles all functionality.
bEnabled=1

[Probe]
; Probing height for raycasting to check for occlusions.
; Casting is done top-down when checking if terrain can be hit without obstructions.
; Use this distance to determine where to cast down from.
; Should be lower than a roof or bridge but higher than anything sitting on the ground.
; Uses game units (512 = ~7.3 m).
fProbeHeight=512

; How much time to allocate for probing per frame (maximum).
; Higher values process the grid faster, lower values are more performant and probing takes longer in total.
fBudget=0.25

[Debug]
; Key that hot reloads the config from disk. (Default: Insert, 0 = no key)
iReloadKey=0x2D
