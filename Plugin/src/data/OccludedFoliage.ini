[General]
; Toggles all functionality.
bEnabled=1

[Probe]
; Probing height for raycasting to check for occlusions.
; Casting is done top-down when checking if terrain can be hit without obstructions.
; Use this distance to determine where to cast down from.
; Should be lower than a roof or bridge but higher than anything sitting on the ground.
; Uses game units (512 = ~7.3 m).
fProbeHeight=512

; How much time to allocate for probing per frame (maximum).
; Higher values process the grid faster, lower values are more performant and probing takes longer in total.
fBudget=0.25

; Distance around the player within which grass spots are checked, in game units (8192 = 2 cells).
; Spots are checked nearest first. Spots in cells the game has not loaded wait until it does.
fRadius=8192

[Debug]
; Key that hot reloads the config from disk. (Default: Insert, 0 = no key)
iReloadKey=0x2D

; Key that probes the spot under the crosshair and logs everything the probe rays hit. (Default: Home, 0 = no key)
iProbeKey=0x24

; Key that logs every loaded grass geometry with its instance data. (Default: Page Up, 0 = no key)
iGrassCensusKey=0x21

; Key that hides the nearest patch of grass, and brings it back on the next press. (Default: Page Down, 0 = no key)
iGrassHideTestKey=0x22

; Logs each cell when its statics are loaded and when all its grass spots are checked, plus a status line every 10 seconds.
bLogMap=0
