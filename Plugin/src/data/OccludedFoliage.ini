[General]
; Toggles all functionality.
bEnabled=1

; Key that toggles bEnabled in game until the next reload. Off brings back all hidden grass. (Default: End = 0xCF, 0 = no key)
; Keys are DirectInput scan codes, as in the GECK and NVSE IsKeyPressed.
iToggleKey=0x3C

[Probe]
; Height at which to raycast downwards, in game units (512 = ~7.3 m).
; Should be lower than a roof or bridge but higher than anything sitting on the ground.
fProbeHeight=512

; Time budget for probing per frame in sync mode (main thread), in milliseconds.
; Adds directly to frame time, as rendering is suspended while probing runs.
fSyncBudget=0.25

; Defers raycasting to a worker thread in paced bursts.
; Experimental. Uses the Havok access lock and may crash unexpectedly.
bAsync=0

; Time budget for probing per frame in async mode (worker thread), in milliseconds.
; Does not add to frame time, only physics are paused while probing runs. 0 = run the full queue without budgeting.
fAsyncBudget=4.0

; Number of probes per allocated burst.
; Higher values have less overhead and get more done but may lock for longer. Lower values are paced more easily but slow overall progress.
iBatchSize=24

; Radius around the player of cells to probe and affect, in game units (4096 = 1 cell).
fRadius=8192

[Debug]
; Key that reloads the config and the blacklist in OccludedFoliageForms.ini from disk. (Default: Insert = 0xD2, 0 = no key)
iReloadKey=0x3D

; Key that probes the grid point under the crosshair and logs every hit. (Default: Home = 0xC7, 0 = no key)
iProbeKey=0

; Key that logs every grass geometry with its instance record. (Default: Page Up = 0xC9, 0 = no key)
iGrassCensusKey=0

; Key that hides the instances of the nearest grass geometry, and restores them on the next press. (Default: Page Down = 0xD1, 0 = no key)
iGrassHideTestKey=0

; Logs cell probing status individually, plus a regular status report.
bLogMap=0

; Logs threads handling Havok physics ticks, time spent, and interference.
bProbePhysics=0

; Stalls the physics worker thread at intervals, for debugging, in milliseconds. 0 = off.
fPhysicsProbeDelay=0
